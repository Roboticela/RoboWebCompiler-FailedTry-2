<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WeatherCard</title>
</head>
<body class="page">
  <div class="shell">
    <div class="now">
      <span class="place">Reykjavik, Iceland</span>
      <span class="temp">7&deg;</span>
      <span class="cond">Overcast &middot; feels like 4&deg;</span>
      <p class="range">High 9&deg; &nbsp; Low 2&deg; &nbsp; Wind 18 km/h</p>
    </div>

    <div class="panel">
      <span class="panel-title">Next five days</span>

      <table class="forecast">
        <tr>
          <td class="fx fx-day">Tue</td>
          <td class="fx fx-cond">Rain</td>
          <td class="fx fx-bar"><div class="bar"><div class="bar-fill bar-1"></div></div></td>
          <td class="fx fx-temp">9&deg;</td>
        </tr>
        <tr>
          <td class="fx fx-day">Wed</td>
          <td class="fx fx-cond">Clouds</td>
          <td class="fx fx-bar"><div class="bar"><div class="bar-fill bar-2"></div></div></td>
          <td class="fx fx-temp">7&deg;</td>
        </tr>
        <tr>
          <td class="fx fx-day">Thu</td>
          <td class="fx fx-cond">Clear</td>
          <td class="fx fx-bar"><div class="bar"><div class="bar-fill bar-3"></div></div></td>
          <td class="fx fx-temp">11&deg;</td>
        </tr>
        <tr>
          <td class="fx fx-day">Fri</td>
          <td class="fx fx-cond">Snow</td>
          <td class="fx fx-bar"><div class="bar"><div class="bar-fill bar-4"></div></div></td>
          <td class="fx fx-temp">1&deg;</td>
        </tr>
        <tr>
          <td class="fx fx-day">Sat</td>
          <td class="fx fx-cond">Wind</td>
          <td class="fx fx-bar"><div class="bar"><div class="bar-fill bar-5"></div></div></td>
          <td class="fx fx-temp">5&deg;</td>
        </tr>
      </table>
    </div>

    <p class="foot">Updated 09:40 &middot; source: station 4012</p>
  </div>
</body>
</html>
