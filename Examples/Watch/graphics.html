<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Graphics</title>
  <link rel="stylesheet" href="graphics.css">
</head>
<body class="page">
  <div class="column">
    <p class="eyebrow">Vector graphics</p>
    <h1 class="title">SVG is drawn, not skipped</h1>
    <p class="lede">An inline document and a linked file reach the frame the same way an image does.</p>

    <svg class="chart" width="300" height="150" viewBox="0 0 300 150" role="img" aria-label="A small chart">
      <rect x="0" y="0" width="300" height="150" fill="#eef2ff"/>
      <rect x="30" y="80" width="40" height="50" fill="#6366f1"/>
      <rect x="90" y="50" width="40" height="80" fill="#818cf8"/>
      <rect x="150" y="20" width="40" height="110" fill="#a5b4fc"/>
      <circle cx="240" cy="115" r="22" fill="#f59e0b" stroke="#b45309" stroke-width="4"/>
      <path d="M30 70 L90 40 L150 10 L240 30" fill="none" stroke="#0f766e" stroke-width="5"/>
    </svg>

    <p class="caption">Bars, a circle with a stroke, and a polyline — one inline <code>svg</code>.</p>

    <p>
      <img class="badge" src="shape.svg" alt="A rounded badge" width="64" height="64">
      <img class="badge" src="shape.svg" alt="A rounded badge" width="40" height="40">
      <span class="note">A linked <code>.svg</code>, drawn at two sizes.</span>
    </p>
  </div>
</body>
</html>
