<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MultiPage - Sign in</title>
</head>
<body class="bg-slate-100 p-8">
  <main class="flex flex-col gap-4">
    <h1 class="text-2xl font-bold text-slate-900">Sign in</h1>

    <form class="flex flex-col gap-2 p-4 bg-white rounded-lg shadow">
      <label for="email" class="font-medium text-slate-800">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" required
             class="border rounded-lg px-4 py-2">
      <label for="password" class="font-medium text-slate-800">Password</label>
      <input id="password" name="password" type="password" required
             class="border rounded-lg px-4 py-2">
      <button id="sign-in" class="px-4 py-2 rounded-lg bg-blue-500 text-white">Sign in</button>
      <button id="reset" type="reset" class="px-4 py-2 rounded-lg bg-slate-200 text-slate-800">Clear</button>
    </form>

    <p class="text-sm text-slate-600">
      <a href="index.html" class="text-blue-600">Back to the start page</a>
    </p>
  </main>

  <script src="login.js" defer></script>
</body>
</html>
