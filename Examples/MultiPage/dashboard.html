<!DOCTYPE html>=
<html lang="en"> 
<head>
  <meta charset="utf-8">
  <title>MultiPage - Dashboard</title>
</head>
<body class="bg-slate-100 p-8">
  <main class="flex flex-col gap-4">
    <h1 class="text-2xl font-bold text-slate-900">Dashboard</h1>

    <table class="bg-white rounded-lg">
      <caption class="text-sm text-slate-600">Sessions this week</caption>
      <thead>
        <tr>
          <th scope="col" class="p-2">Day</th>
          <th scope="col" class="p-2">Sessions</th>
        </tr>
      </thead>
      <tbody>
        <tr><td class="p-2">Monday</td><td class="p-2">12</td></tr>
        <tr><td class="p-2">Tuesday</td><td class="p-2" data-sessions="18">18</td></tr>
        <tr><td class="p-2">Wednesday</td><td class="p-2">9</td></tr>
      </tbody>
      <tfoot>
        <tr><td class="p-2 font-medium" colspan="1">Total</td><td id="total" class="p-2 font-medium">39</td></tr>
      </tfoot>
    </table>

    <details class="p-4 bg-white rounded-lg" open>
      <summary class="cursor-pointer font-medium">Notes</summary>
      <p class="text-slate-600">Every row is lowered into a native table category.</p>
    </details>

    <p class="text-sm text-slate-600">
      <a href="index.html" class="text-blue-600">Back to the start page</a>
    </p>
  </main>

  <script src="dashboard.js" defer></script>
</body>
</html>
