<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BasicApp</title>
</head>
<body class="bg-slate-100 p-8">
  <main class="flex flex-col gap-4">
    <h1 class="text-3xl font-bold text-slate-900">BasicApp</h1>
    <p class="text-slate-700">A small RoboHTMLCompiler application.</p>

    <form class="flex flex-col gap-2 p-4 bg-white rounded-lg shadow">
      <label for="task" class="font-medium text-slate-800">Task</label>
      <input id="task" name="task" type="text" placeholder="Write a task" required maxlength="120"
             class="border rounded-lg px-4 py-2">
      <button id="save" class="px-4 py-2 rounded-lg bg-blue-500 text-white">Save</button>
      <button id="cancel" type="reset" class="px-4 py-2 rounded-lg bg-slate-200 text-slate-800">Cancel</button>
      <input id="locked" type="text" placeholder="Unavailable in this demo" disabled
             class="border rounded-lg px-4 py-2 bg-slate-100 text-slate-500">
    </form>

    <ul id="tasks" class="flex flex-col gap-1"></ul>

    <figure class="p-4 bg-white rounded-lg">
      <svg viewBox="0 0 120 60" width="240" height="120" role="img" aria-label="A small chart">
        <rect x="0" y="0" width="120" height="60" fill="#f1f5f9"></rect>
        <circle cx="30" cy="30" r="20" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"></circle>
        <path d="M60 50 L80 10 L100 50 Z" fill="#22c55e"></path>
        <text x="60" y="58" text-anchor="middle" font-size="8" fill="#334155">chart</text>
      </svg>
      <figcaption class="text-sm text-slate-600">SVG has its own namespace and native categories.</figcaption>
    </figure>

    <p class="p-4 bg-white rounded-lg text-lg">
      <math display="block">
        <msup><mi>x</mi><mn>2</mn></msup>
        <mo>+</mo>
        <mfrac><mn>1</mn><mn>2</mn></mfrac>
      </math>
    </p>

    <table class="bg-white rounded-lg">
      <caption class="text-sm text-slate-600">Task summary</caption>
      <thead>
        <tr><th scope="col">Task</th><th scope="col">State</th></tr>
      </thead>
      <tbody>
        <tr><td colspan="2">Nothing yet</td></tr>
      </tbody>
    </table>

    <details class="p-4 bg-white rounded-lg">
      <summary class="cursor-pointer font-medium">More</summary>
      <p class="text-slate-600">A disclosure is a native category, not a scripted widget.</p>
    </details>

    <button id="badge" data-user-id="123" class="px-2 py-1 bg-slate-200 rounded">Metadata example</button>

    <my-component class="card">Custom elements resolve to a native custom category.</my-component>

    <img src="logo.svg" alt="RoboHTMLCompiler logo" width="32" height="32">
  </main>
  <script src="app.js" defer></script>
</body>
</html>
